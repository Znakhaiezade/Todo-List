<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <div><h1 id="title">♡ My Todo List</h1></div>
          <div><p id="Description">Keep things simple.</p></div>
        </div>
      </header>
      <main>
        <section>
          <div id="new-task">
            <h2>Add a new task</h2>
            <form id="task-form">
              <div id="new-task-title">
                <input id="task-title" type="text" placeholder="Task title" />
              </div>
              <div id="new-task-description">
                <input
                  id="task-description"
                  type="text"
                  placeholder="Description"
                />
              </div>
              <div id="task-details">
                <input id="priority" type="number" placeholder="Priority" />
                <input id="date" type="date" placeholder="Date" />
              </div>
              <button type="button" class="add-btn">+ Add Task</button>
            </form>
          </div>
        </section>
        <div><h2 id="my-tasks">My Tasks</h2></div>
        <section>
          <form id="filter-form">
            <div id="tasks-filter">
              <input
                id="Priority-filter"
                type="number"
                placeholder="Priority filter"
              />
              <input id="date-filter" type="date" placeholder="Date filter" />
            </div>
          </form>
        </section>
        <section>
          <div class="task-list"></div>
        </section>
        <div class="modal hidden">
          <div class="model-content">
            <h2>Edit Task</h2>
            <input id="edit-title" type="text" placeholder="Task title" />
            <input
              id="edit-description"
              type="text"
              placeholder="Description"
            />
            <input id="edit-priority" type="number" placeholder="Priority" />
            <input id="edit-date" type="date" />
            <button id="save-btn" type="button">Save</button>
            <button id="cancel-btn" type="button">Cancel</button>
          </div>
        </div>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
